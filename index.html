<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarCat</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Custom CSS -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        
        /* Botón para desplegar el menú */
        .menu-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background 0.2s;
        }
        .menu-toggle-btn:hover { background: #f0f0f0; }

        /* Botón para activar/desactivar pantalla completa (al lado del menú) */
        .fullscreen-toggle-btn {
            position: absolute;
            top: 20px;
            right: 74px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background 0.2s;
        }
        .fullscreen-toggle-btn:hover { background: #f0f0f0; }

        /* Contenedor Superior Derecha (Botones y Sliders) */
        .controls-container {
            position: absolute;
            top: 70px; /* Desplazado hacia abajo para no tapar el botón del menú */
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 210px;
            transition: opacity 0.3s, transform 0.3s;
            transform-origin: top right;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        /* Clase para ocultar elementos de la UI */
        .hidden {
            display: none !important;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: -5px;
            margin-top: 5px;
        }
        .control-label:first-child {
            margin-top: 0;
        }
        
        /* Estilo para el selector de mapa base */
        .map-select {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            font-family: inherit;
            color: #333;
            outline: none;
        }
        .map-select:hover { border-color: #0084ff; }

        .toggle-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .toggle-btn:hover { background: #f5f5f5; }
        .toggle-btn.active {
            background: #0084ff;
            color: white;
            border-color: #0084ff;
        }

        /* Estilos de los Sliders de Opacidad */
        .opacity-control {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            color: #444;
            margin-top: 2px;
        }
        .opacity-control label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
        }
        .opacity-control input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 5px 0;
            width: 100%;
        }

        /* Estilo para los nombres de las comarcas en el mapa */
        .comarque-label {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            font-size: var(--comarca-font-size, 10px); /* Controlado por variable CSS */
            font-weight: bold;
            color: #222;
            text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff;
            text-align: center;
            white-space: nowrap;
        }

        /* Contenedor Inferior (Línea de tiempo / Slider) */
        .timeline-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 15px;
            width: 50%;
            max-width: 500px;
        }
        .play-btn {
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }
        .play-btn:hover { background: #006bce; }
        
        .slider-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #timestamp-display {
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        .timeline-container input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Rendering para imágenes de radar */
        .radar-pixelated {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        /* Mode "Només núvols": es fusionen les tessel·les del satèl·lit
           (GeoColour) amb el mapa base amb mix-blend-mode "multiply", després
           d'invertir-ne els tons (filter). Amb "multiply", un píxel blanc de
           la capa deixa el mapa base intacte (= invisible) i un píxel gris
           l'enfosqueix proporcionalment; per això cal que la terra/mar
           (originalment foscos) es converteixin en blancs (invisibles) i els
           núvols (originalment blancs) es converteixin en un gris clar ben
           visible. És la tècnica contrària a fer-ho amb "screen" —que amb un
           mapa base clar sempre dona blanc, per molt clars o foscos que
           siguin els núvols— i per tant funciona igual de bé sia quin
           sigui el color del mapa base. */
        body.clouds-only-active .satellite-tile {
            mix-blend-mode: multiply;
            filter: grayscale(1) contrast(1.5) invert(0.7) brightness(1.8);
        }

        /* MARCADOR D'UBICACIÓ DE L'USUARI (estil "punt blau" tipus Google Maps) */
        .user-location-marker-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
        }
        .user-location-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border-radius: 50%;
            background: rgba(26, 115, 232, 0.35);
            animation: user-location-pulse 2.2s ease-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes user-location-pulse {
            0% { transform: scale(0.4); opacity: 0.8; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .user-location-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            background: #1a73e8;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.35);
            z-index: 3;
        }
        /* Con d'orientació: triangle amb l'àpex al centre exacte del punt blau,
           rotat segons el rumb del dispositiu (brúixola o GPS en moviment). */
        .user-heading-cone {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 76px;
            height: 76px;
            margin: -76px 0 0 -38px;
            transform-origin: 50% 100%;
            transform: rotate(0deg);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
            pointer-events: none;
            clip-path: polygon(50% 100%, 18% 6%, 82% 6%);
            background: radial-gradient(circle at 50% 100%, rgba(26,115,232,0.55) 0%, rgba(26,115,232,0.22) 55%, rgba(26,115,232,0) 100%);
        }
        .user-heading-cone.active { opacity: 1; }

        /* PANELL EMERGENT DE PRECIPITACIÓ ACUMULADA (clic al mapa) */
        .precip-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .precip-popup .leaflet-popup-content {
            margin: 12px 14px;
        }
        .precip-popup-content {
            min-width: 250px;
            font-family: inherit;
        }
        .precip-popup-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }
        .precip-popup-total {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0084ff;
            line-height: 1.1;
        }
        .precip-popup-total span {
            font-size: 1rem;
            font-weight: 600;
            color: #666;
        }
        .precip-popup-subtitle {
            font-size: 0.78rem;
            color: #666;
            margin-bottom: 8px;
        }
        .precip-popup-disclaimer {
            font-size: 0.7rem;
            color: #999;
            margin-top: 8px;
            line-height: 1.35;
        }
        .precip-popup-error {
            font-size: 0.85rem;
            color: #444;
            max-width: 240px;
            line-height: 1.4;
        }
        .precip-loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 4px;
        }
        .precip-loading-spinner {
            width: 26px;
            height: 26px;
            border: 3px solid #e0e0e0;
            border-top-color: #0084ff;
            border-radius: 50%;
            animation: precip-spin 0.8s linear infinite;
            margin-bottom: 8px;
        }
        .precip-loading-text {
            font-size: 0.8rem;
            color: #666;
        }
        @keyframes precip-spin {
            to { transform: rotate(360deg); }
        }

        /* LEYENDA (ESQUINA INF. IZQ) */
        .legend-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(245, 245, 245, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .legend-title {
            font-size: 0.85rem;
            color: #4A6382; 
            text-align: center;
            margin-bottom: 2px;
        }
        .legend-bar-container {
            width: 100%;
        }
        .legend-bar {
            display: flex;
            height: 10px;
            border: 1px solid #777;
            width: 100%;
        }
        .color-block {
            flex: 1;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        .color-block:last-child {
            border-right: none;
        }
        .legend-labels {
            position: relative;
            height: 15px;
            margin-top: 4px;
        }
        .legend-label-text {
            position: absolute;
            font-size: 0.75rem;
            color: #4A6382;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* Notificación de error (toast) */
        #notice-toast {
            display: none;
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(190, 40, 40, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 80%;
            text-align: center;
        }

        /* BUSCADOR DE LOCALITATS (SUPERIOR CENTRAT) */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0.7);
            transform-origin: top center;
            z-index: 1001;
            width: min(90vw, 420px);
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            padding: 6px 8px 6px 16px;
        }
        .search-box svg {
            flex-shrink: 0;
            color: #666;
        }
        #location-search {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            padding: 8px 8px;
            font-family: inherit;
            color: #222;
            min-width: 0;
        }
        #search-clear-btn {
            border: none;
            background: none;
            cursor: pointer;
            color: #999;
            display: none;
            padding: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        #search-clear-btn:hover { background: #f0f0f0; color: #555; }
        #search-clear-btn.visible { display: flex; align-items: center; justify-content: center; }

        #search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        #search-suggestions.visible { display: block; }
        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.88rem;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.3;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover, .suggestion-item.highlighted { background: #f0f7ff; }
        .suggestion-item svg { flex-shrink: 0; margin-top: 2px; color: #0084ff; }
        .suggestion-empty, .suggestion-loading {
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
        }

        /* MARCADOR DE CERCA (CERCLE, ESTIL SIMILAR AL PUNT D'UBICACIÓ) */
        .search-marker-icon {
            position: relative;
            width: 18px;
            height: 18px;
        }
        .search-marker-icon .marker-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-sizing: border-box;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.4);
        }
        .search-marker-icon .marker-menu {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 6px;
            background: white;
            padding: 5px;
            border-radius: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }
        .search-marker-icon:hover .marker-menu {
            display: flex;
        }
        .marker-menu button {
            border: none;
            background: #f2f2f2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .marker-menu .btn-remove:hover { background: #ffd6d6; }
        .marker-menu .btn-pin:hover { background: #ffe9b3; }
        .marker-menu .btn-pin.is-pinned { background: #ffcf5c; }
        .search-marker-icon .pin-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
            white-space: nowrap;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }
        .search-marker-icon:hover .pin-label {
            display: block;
        }

        /* MAPA DE PLUJA ACUMULADA (overlay de tota la pantalla) */
        .accum-rain-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255, 255, 255, 0.97);
            padding: 26px 34px;
            border-radius: 14px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 260px;
        }
        .accum-rain-spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e0;
            border-top-color: #0084ff;
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: precip-spin 0.8s linear infinite;
        }
        .accum-rain-loading-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
        }
        .accum-rain-loading-subtext {
            font-size: 0.75rem;
            font-weight: 400;
            color: #777;
            margin-top: 4px;
        }
        .accum-rain-close-btn {
            position: absolute;
            top: 20px;
            right: 74px;
            z-index: 2001;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #333;
            transition: background 0.2s, transform 0.1s;
        }
        .accum-rain-close-btn:hover { background: #f5f5f5; }
        .accum-rain-close-btn:active { transform: scale(0.95); }
        .accum-rain-title-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2001;
            background: rgba(255, 255, 255, 0.97);
            padding: 9px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            font-size: 0.85rem;
            font-weight: 700;
            color: #333;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- Botón de Menú para mostrar/ocultar panel -->
    <button id="menu-toggle" class="menu-toggle-btn" title="Opcions del Mapa" aria-label="Obrir o tancar el menú d'opcions" aria-expanded="false" aria-controls="controls-menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Botón de Pantalla Completa -->
    <button id="fullscreen-toggle" class="fullscreen-toggle-btn" title="Pantalla completa" aria-label="Activar pantalla completa" aria-pressed="false">
        <svg id="fullscreen-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
    </button>

    <!-- Buscador de localitats -->
    <div class="search-container">
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="location-search" placeholder="Cerca una localitat o lloc..." autocomplete="off" aria-label="Cerca una localitat o lloc" role="combobox" aria-expanded="false" aria-controls="search-suggestions">
            <button id="search-clear-btn" title="Esborrar" aria-label="Esborrar la cerca">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="search-suggestions" role="listbox"></div>
    </div>

    <!-- Controles Superiores -->
    <div id="controls-menu" class="controls-container hidden">
        
        <span class="control-label">Mapa Base</span>
        <select id="basemap-select" class="map-select" aria-label="Selecciona el mapa base">
            <option value="carto">Carto Light (Defecte)</option>
            <option value="osm">OpenStreetMap</option>
            <option value="google">Google Maps</option>
            <option value="pnoa">Ortofoto PNOA (IGN)</option>
            <option value="hillshade">Relleu Sombrejat (Hillshade)</option>
        </select>
        
        <hr>

        <span class="control-label">Capes Meteocat</span>
        <button id="btn-rain" class="toggle-btn active" aria-pressed="true">
            Radar
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Chart.js (per a la gràfica d'acumulació de precipitació) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    
    <!-- RADAR SCRIPT -->
    <script>
    const CONFIG = {
        INTERVAL_MINUTES: 6,
        TIMELINE_LENGTH: 27, // 27 x 6min ≈ 2,7 hores de recorregut
        ACCUM_FRAME_COUNT: 11, // 11 imatges = 10 intervals x 6min = 60 min = 1 hora exacta d'acumulació
        CENTER: [41.7, 1.8],
        ZOOM: 8,
        URLS: {
            rain: "https://static-m.meteo.cat/tiles/radar/{any}/{mes}/{dia}/{hora}/{minut}/{z}/000/000/{x}/000/000/{y}.png",
            snow: "https://static-m.meteo.cat/tiles/plujaneu/{any}/{mes}/{dia}/{hora}/{minut}/{z}/000/000/{x}/000/000/{y}.png"
        },
        ANIMATION_SPEED: 200,
        LOOP_PAUSE_MS: 1000 // pausa al arribar al final abans de reiniciar el bucle
    };

    const LEGEND_DATA = {
        rain: {
            title: "Intensitat de precipitació",
            colors: [
                "#7E1BCE", "#4214C9", "#151AE8", "#0328FF", "#01DEFE", 
                "#00FFB2", "#08FF36", "#64FF00", "#A8FF00", "#EEFF00", 
                "#FDB700", "#FF7B00", "#FF3B00", "#E40000", "#C5002C", 
                "#ED006A", "#F300C3", "#E300FF", "#FFFFFF"
            ],
            labels: [
                { text: "feble", position: "5%" },
                { text: "moderada", position: "33%" },
                { text: "forta", position: "66%" },
                { text: "calamarsa", position: "95%" }
            ]
        },
        snow: {
            title: "Tipus de precipitació",
            colors: [
                "#F9C7CB", "#F49F9F", "#EE7777", "#E94F4F", "#D73030", "#A61C1C", 
                "#DDF5CD", "#BDF2AA", "#91F080", "#54E747", "#1EAA14", "#098402", 
                "#CAECFA", "#9FCAE6", "#73A8D3", "#4A87C1", "#2264AC", "#0D4293"  
            ],
            labels: [
                { text: "Pluja", position: "15%" },
                { text: "Aiguaneu", position: "50%" },
                { text: "Neu", position: "85%" }
            ]
        },
        accum: {
            title: "Pluja acumulada (mm)",
            colors: [
                "#7E1BCE", "#4214C9", "#151AE8", "#0328FF", "#01DEFE", 
                "#00FFB2", "#08FF36", "#64FF00", "#A8FF00", "#EEFF00", 
                "#FDB700", "#FF7B00", "#FF3B00", "#E40000", "#C5002C", 
                "#ED006A", "#F300C3", "#E300FF", "#FFFFFF"
            ],
            labels: [
                { text: "0,1 mm", position: "3%" },
                { text: "5 mm", position: "27%" },
                { text: "26 mm", position: "55%" },
                { text: "100+ mm", position: "88%" }
            ]
        }
    };

    // Escala aproximada d'intensitat (mm/h) associada a cada color de la llegenda del radar.
    // És una estimació orientativa (no un valor oficial de Meteocat) basada en escales
    // habituals d'intensitat de precipitació per radar.
    const RAIN_INTENSITY_MMH = [
        0.1, 0.2, 0.5, 1, 1.5, 2, 3, 4, 5, 6,
        8, 10, 15, 20, 30, 40, 60, 80, 100
    ];

    function hexToRgb(hex) {
        hex = hex.replace('#', '');
        const bigint = parseInt(hex, 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    }

    const RAIN_COLOR_RGB = LEGEND_DATA.rain.colors.map(hexToRgb);

    let map;
    let currentMode = 'rain';
    let appliedMode = null;
    let visibleTimestamp = null;
    let isApplyingLayer = false;
    
    let timelineDates = [];
    let layerCache = {};
    let currentIndex = CONFIG.TIMELINE_LENGTH - 1;
    let playInterval;
    let loopRestartTimeout;
    let isPlaying = false;
    
    let currentRadarOpacity = 0.5;

    // Configuració de la capa de satèl·lit en directe (núvols).
    // S'utilitza el servei WMS públic i gratuït d'EUMETSAT (EUMETView), que
    // serveix les imatges del satèl·lit geoestacionari Meteosat Third
    // Generation (MTG), producte GeoColour RGB, amb resolució d'1 km i
    // actualització cada 10 minuts. El servidor accepta qualsevol data/hora
    // (paràmetre TIME) i "arrodoneix" automàticament al fotograma disponible
    // més proper (nearestValue), per això no cal descarregar cap llista de
    // fotogrames: només calculem la marca de temps que volem mostrar.
    const SATELLITE_CONFIG = {
        WMS_URL: 'https://view.eumetsat.int/geoserver/wms',
        LAYER: 'mtg_fd:rgb_geocolour',
        STEP_MINUTES: 10, // Cadència de publicació de fotogrames del MTG
        REFRESH_INTERVAL_MS: 2 * 60 * 1000, // Es comprova cada 2 min si toca mostrar un fotograma més nou
        MAX_CACHED_FRAMES: 24, // Nombre màxim de capes simultànies en memòria (cobreix tota la línia de temps del radar)
        Z_INDEX: 60 // Per sota del radar (100), per poder comparar-los superposats
    };
    let satelliteEnabled = false;
    let satelliteLayerCache = {}; // clau: ISO string (arrodonit als 10 min) -> L.TileLayer.WMS
    let satelliteActiveTimeKey = null;
    let currentSatelliteOpacity = 0.5;
    let satelliteRefreshTimer = null;
    let satelliteRequestToken = 0; // per descartar respostes de fotogrames obsolets si l'usuari mou el slider ràpid

    let comarquesLayer; 
    let municipisLayer = null; 
    let nomsComarquesLayer = L.layerGroup(); 
    
    let userLocationMarker = null;
    let userAccuracyCircle = null;
    let watchPositionId = null;
    let deviceHeading = null;
    let headingListenerActive = false;
    let headingEventName = null;

    // Estat del càlcul de precipitació acumulada (clic al mapa)
    let precipPopup = null;
    let precipChartInstance = null;
    let precipRequestId = 0;

    // Estat del "Mapa de pluja acumulada" (overlay pixelat sobre tot Catalunya)
    let catalunyaGeoJSONData = null;
    let accumRainOverlay = null;
    let accumRainRequestId = 0;
    let currentAccumRainOpacity = 0.85;

    // Escala d'acumulació (mm en 1h) associada a la mateixa gamma de colors del radar
    const ACCUM_BINS_MM = [0.1, 1, 2, 3, 5, 7, 10, 13, 17, 21, 26, 32, 40, 50, 65, 80, 100, 130, 160];
    const ACCUM_GRAY_RGB = [175, 175, 175]; // zones sense pluja (dins de Catalunya)

    const baseMaps = {
        carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }),
        google: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google Maps',
            maxZoom: 20
        }),
        pnoa: L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma', {
            layers: 'OI.OrthoimageCoverage',
            format: 'image/jpeg',
            transparent: false,
            attribution: '&copy; IGN PNOA',
            maxZoom: 20
        }),
        hillshade: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        })
    };
    
    let currentBasemap = baseMaps.carto;

    const MeteocatTileLayer = L.TileLayer.extend({
        getTileUrl: function (coords) {
            if (!coords) return "";
            let y = coords.y;
            if (this.options.tms) {
                y = this._globalTileRange.max.y - coords.y;
            }
            const pad = (val, len) => String(val).padStart(len, '0');
            
            let url = this._url;
            url = url.replace('{z}', pad(coords.z, 2));
            url = url.replace('{x}', pad(coords.x, 3));
            url = url.replace('{y}', pad(y, 3));
            return url;
        }
    });

    // Local Storage preferences key & helper
    const PREFS_KEY = 'radar_prefs_v1';
    function savePrefs(prefs) {
        try {
            localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
        } catch (e) {
            console.warn('No s\'ha pogut guardar preferències:', e);
        }
    }
    function loadPrefs() {
        try {
            const raw = localStorage.getItem(PREFS_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            console.warn('Error llegint preferències:', e);
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initMap();
        updateLegendUI(); 
        checkLatestImage().then(scheduleNextRadarCheck);
        initSearch();
        initFullscreenToggle();

        // Load saved preferences (if any)
        if (typeof applySavedPreferences === 'function') applySavedPreferences();

        const menuBtn = document.getElementById('menu-toggle');
        const controlsMenu = document.getElementById('controls-menu');
        menuBtn.addEventListener('click', () => {
            const willShow = controlsMenu.classList.contains('hidden');
            controlsMenu.classList.toggle('hidden');
            menuBtn.setAttribute('aria-expanded', String(willShow));
        });

        const toggleLegendCheckbox = document.getElementById('toggle-legend');
        const legendContainer = document.getElementById('legend-container');
        toggleLegendCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                legendContainer.classList.remove('hidden');
            } else {
                legendContainer.classList.add('hidden');
            }
            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        });

        const toggleMunicipisCheckbox = document.getElementById('toggle-municipis');
        toggleMunicipisCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                loadMunicipisGeoJSON();
            } else {
                if (municipisLayer) {
                    map.removeLayer(municipisLayer);
                    municipisLayer = null;
                }
            }
            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        });

        const toggleLocationCheckbox = document.getElementById('toggle-location');
        toggleLocationCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                if (navigator.geolocation) {
                    watchPositionId = navigator.geolocation.watchPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            const accuracy = (typeof position.coords.accuracy === 'number') ? position.coords.accuracy : null;

                            if (!userLocationMarker) {
                                userLocationMarker = L.marker([lat, lng], {
                                    icon: buildUserLocationIcon(),
                                    interactive: false,
                                    zIndexOffset: 1000
                                }).addTo(map);
                            } else {
                                userLocationMarker.setLatLng([lat, lng]);
                            }

                            // Cercle de precisió del GPS (radi real en metres, escala amb el zoom)
                            if (accuracy !== null && !isNaN(accuracy)) {
                                if (!userAccuracyCircle) {
                                    userAccuracyCircle = L.circle([lat, lng], {
                                        radius: accuracy,
                                        color: '#1a73e8',
                                        weight: 1,
                                        opacity: 0.35,
                                        fillColor: '#1a73e8',
                                        fillOpacity: 0.10,
                                        interactive: false
                                    }).addTo(map);
                                } else {
                                    userAccuracyCircle.setLatLng([lat, lng]);
                                    userAccuracyCircle.setRadius(accuracy);
                                }
                            }

                            // Si no hi ha brúixola activa, aprofitem el rumb GPS (només fiable en moviment)
                            if (!headingListenerActive && typeof position.coords.heading === 'number' && !isNaN(position.coords.heading)) {
                                deviceHeading = position.coords.heading;
                            }
                            updateMarkerHeading();
                        },
                        (error) => {
                            console.error("Error obtenint la ubicació:", error);
                            showNotice("No s'ha pogut obtenir la ubicació. Comprova els permisos del navegador.");
                            toggleLocationCheckbox.checked = false;
                        },
                        { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                    );
                    startCompass();
                } else {
                    showNotice("El teu navegador no suporta la geolocalització.");
                    toggleLocationCheckbox.checked = false;
                }
            } else {
                if (watchPositionId !== null) {
                    navigator.geolocation.clearWatch(watchPositionId);
                    watchPositionId = null;
                }
                if (userLocationMarker) {
                    map.removeLayer(userLocationMarker);
                    userLocationMarker = null;
                }
                if (userAccuracyCircle) {
                    map.removeLayer(userAccuracyCircle);
                    userAccuracyCircle = null;
                }
                stopCompass();
            }
        });

        document.getElementById('basemap-select').addEventListener('change', (e) => {
            map.removeLayer(currentBasemap);
            currentBasemap = baseMaps[e.target.value];
            currentBasemap.addTo(map);
            
            for (let key in satelliteLayerCache) satelliteLayerCache[key].bringToFront();
            for (let key in layerCache) {
                layerCache[key].bringToFront();
            }
            if (comarquesLayer) comarquesLayer.bringToFront();
            if (municipisLayer) municipisLayer.bringToFront();
            if (userAccuracyCircle) userAccuracyCircle.bringToFront();
            if (userLocationMarker) userLocationMarker.bringToFront();

            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        });

        document.getElementById('btn-rain').addEventListener('click', () => setMode('rain'));
        document.getElementById('btn-snow').addEventListener('click', () => setMode('snow'));

        document.getElementById('btn-satellite').addEventListener('click', () => {
            const btn = document.getElementById('btn-satellite');
            const willEnable = !satelliteEnabled;
            btn.classList.toggle('active', willEnable);
            btn.setAttribute('aria-pressed', String(willEnable));
            document.getElementById('satellite-timestamp-note').classList.toggle('hidden', !willEnable);
            if (willEnable) {
                enableSatellite();
            } else {
                disableSatellite();
            }
            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        });

        // "Només núvols": fusiona (mix-blend-mode: screen) les tessel·les del
        // satèl·lit amb el mapa base, de manera que el mar i la terra —molt
        // més foscos que els núvols dins el compost GeoColour— pràcticament
        // desapareixen i només es veuen els núvols. Actiu per defecte.
        document.body.classList.add('clouds-only-active');
        document.getElementById('btn-clouds-only').addEventListener('click', () => {
            const btn = document.getElementById('btn-clouds-only');
            const willEnable = !document.body.classList.contains('clouds-only-active');
            document.body.classList.toggle('clouds-only-active', willEnable);
            btn.classList.toggle('active', willEnable);
            btn.setAttribute('aria-pressed', String(willEnable));
            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        });

        // Throttle basat en requestAnimationFrame: evita que cada micro-moviment
        // d'un slider dispari immediatament una actualització del DOM/Leaflet.
        // Es queda amb els últims arguments rebuts i només executa `fn` una
        // vegada per frame, cosa que alleugereix molt els dispositius mòbils
        // de gamma baixa sense afegir latència perceptible.
        function rafThrottle(fn) {
            let rafId = null;
            let lastArgs = null;
            return function (...args) {
                lastArgs = args;
                if (rafId === null) {
                    rafId = requestAnimationFrame(() => {
                        rafId = null;
                        fn.apply(this, lastArgs);
                    });
                }
            };
        }

        document.getElementById('opacity-satellite').addEventListener('input', rafThrottle((e) => {
            currentSatelliteOpacity = parseInt(e.target.value) / 100;
            document.getElementById('val-opacity-satellite').textContent = e.target.value + '%';
            if (satelliteEnabled) renderActiveSatelliteFrame();
            if (typeof persistUiPrefs === 'function') persistUiPrefs();
        }));

        document.getElementById('btn-accum-rain').addEventListener('click', () => {
            if (accumRainOverlay) {
                if (typeof closeAccumulatedRainMap === 'function') closeAccumulatedRainMap();
            } else {
                if (typeof generateAccumulatedRainMap === 'function') generateAccumulatedRainMap();
            }
        });

        // --- Keyboard shortcuts: left/right -> slider; space -> play/pause
        document.addEventListener('keydown', (ev) => {
            // Ignore when typing in inputs or contentEditable regions
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
            if (ev.key === 'ArrowLeft') {
                if (timelineDates.length === 0) return;
                ev.preventDefault();
                if (currentIndex > 0) {
                    currentIndex = Math.max(0, currentIndex - 1);
                    document.getElementById('time-slider').value = currentIndex;
                    renderActiveLayer();
                    if (isPlaying) togglePlay(false);
                }
            } else if (ev.key === 'ArrowRight') {
                if (timelineDates.length === 0) return;
                ev.preventDefault();
                if (currentIndex < CONFIG.TIMELINE_LENGTH - 1) {
                    currentIndex = Math.min(CONFIG.TIMELINE_LENGTH - 1, currentIndex + 1);
                    document.getElementById('time-slider').value = currentIndex;
                    renderActiveLayer();
                    if (isPlaying) togglePlay(false);

            } else if (ev.code === 'Space' || ev.key === ' ') {

                ev.preventDefault();
                togglePlay();

    const FULLSCREEN_ENTER_ICON = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
    const FULLSCREEN_EXIT_ICON = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>';

    function isDocumentFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreenCompat(el) {
        const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (fn) return fn.call(el);
        return Promise.reject(new Error('API no suportada'));
    }

    function exitFullscreenCompat() {
        const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (fn) return fn.call(document);
        return Promise.reject(new Error('API no suportada'));
    }

    function updateFullscreenButtonUI() {
        const btn = document.getElementById('fullscreen-toggle');
        const icon = document.getElementById('fullscreen-icon');
        if (!btn || !icon) return;
        const active = isDocumentFullscreen();
        icon.innerHTML = active ? FULLSCREEN_EXIT_ICON : FULLSCREEN_ENTER_ICON;
        btn.title = active ? 'Sortir de pantalla completa' : 'Pantalla completa';
        btn.setAttribute('aria-label', active ? 'Sortir de pantalla completa' : 'Activar pantalla completa');
        btn.setAttribute('aria-pressed', String(active));
    }

    function initFullscreenToggle() {
        const btn = document.getElementById('fullscreen-toggle');
        if (!btn) return;

        btn.addEventListener('click', () => {
            if (!isDocumentFullscreen()) {
                requestFullscreenCompat(document.documentElement).catch((err) => {
                    console.error('Error activant pantalla completa:', err);
                    showNotice("No s'ha pogut activar la pantalla completa en aquest dispositiu.");
                });
            } else {
                exitFullscreenCompat().catch((err) => {
                    console.error('Error sortint de pantalla completa:', err);
                });
            }
        });

        ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach((evt) => {
            document.addEventListener(evt, updateFullscreenButtonUI);
        });

        updateFullscreenButtonUI();

    function loadComarquesGeoJSON() {

        fetch(geojsonUrl)
            .then(response => {

                return response.json();
            })
            .then(data => {
                catalunyaGeoJSONData = data;
                comarquesLayer = L.geoJSON(data, {
                    style: {
                        color: "#222222", 
                        weight: 1.5,      
                        opacity: 0.5, 
                        fillOpacity: 0    
                    },
                    interactive: false,
                    onEachFeature: function (feature, layer) {
                        let props = feature.properties;
                        let nomComarca = "Comarca";
                        
                        if (props) {
